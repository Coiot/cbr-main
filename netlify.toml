[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2260000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2260000"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=2260000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=2260000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2260000"

[build]
  environment = { NODE_OPTIONS = "--max_old_space_size=4096", NODE_VERSION = "22.14.0" }

# Search payload names contain a content hash; the small manifest tracks releases.
[[headers]]
  for = "/data/albums/search/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/albums/search-manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
